<style>

/* =====================================================
   COLORES PRINCIPALES — ORO INTENSO
===================================================== */

:root{
    --oro:#D4AF37;
    --oro-brillante:#FFD966;
    --oro-claro:#F7E7A8;
    --oro-oscuro:#9A7418;
    --negro:#222222;
    --blanco:#ffffff;
    --crema:#fffdf7;
}


/* =====================================================
   GENERAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Georgia,"Times New Roman",serif;
    background:#fff;
    color:var(--negro);
    overflow-x:hidden;
}


/* =====================================================
   BRILLO GENERAL
===================================================== */

body::before{
    content:"";

    position:fixed;
    inset:0;

    pointer-events:none;

    z-index:0;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,217,102,.10),
            transparent 22%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(212,175,55,.10),
            transparent 25%
        );
}


/* =====================================================
   DESTELLOS
===================================================== */

.sparkle{
    position:fixed;

    color:var(--oro-brillante);

    font-size:22px;

    pointer-events:none;

    z-index:10;

    text-shadow:
        0 0 5px #fff,
        0 0 12px var(--oro),
        0 0 25px var(--oro);

    animation:
        magicFloat 3s infinite ease-in-out,
        goldenGlow 2s infinite alternate;
}

.s1{
    top:12%;
    left:7%;
}

.s2{
    top:27%;
    right:8%;
    animation-delay:.5s;
}

.s3{
    top:52%;
    left:5%;
    animation-delay:1s;
}

.s4{
    top:74%;
    right:7%;
    animation-delay:1.5s;
}

.s5{
    top:88%;
    left:18%;
    animation-delay:2s;
}

.s6{
    top:42%;
    right:20%;
    animation-delay:1.3s;
}

@keyframes magicFloat{

    0%,100%{
        opacity:.25;
        transform:
            translateY(0)
            scale(.65)
            rotate(0deg);
    }

    50%{
        opacity:1;
        transform:
            translateY(-18px)
            scale(1.45)
            rotate(25deg);
    }

}

@keyframes goldenGlow{

    from{
        text-shadow:
            0 0 3px #fff,
            0 0 8px var(--oro);
    }

    to{
        text-shadow:
            0 0 7px #fff,
            0 0 18px var(--oro-brillante),
            0 0 35px var(--oro);
    }

}


/* =====================================================
   APERTURA
===================================================== */

.intro{
    position:fixed;
    inset:0;

    z-index:9999;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:
        radial-gradient(
            circle at center,
            #ffffff 0%,
            #fffdf8 42%,
            #f1d77b 100%
        );

    transition:
        opacity 1.3s ease,
        visibility 1.3s ease;
}

.intro.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}


/* Aura alrededor del sobre */

.intro::before{
    content:"";

    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,217,102,.35),
            rgba(212,175,55,.12),
            transparent 70%
        );

    animation:
        aura 3s infinite ease-in-out;
}

@keyframes aura{

    0%,100%{
        transform:scale(.85);
        opacity:.5;
    }

    50%{
        transform:scale(1.2);
        opacity:1;
    }

}


/* =====================================================
   SOBRE
===================================================== */

.envelope{
    width:min(92vw,680px);

    min-height:520px;

    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #fffdf7
        );

    border:2px solid var(--oro);

    box-shadow:
        0 0 0 7px rgba(255,255,255,.9),
        0 0 0 9px var(--oro),
        0 0 35px rgba(212,175,55,.65),
        0 25px 80px rgba(0,0,0,.22);

    overflow:hidden;
}


/* Marco interior */

.envelope::before{
    content:"";

    position:absolute;

    inset:15px;

    border:1px solid var(--oro);

    box-shadow:
        inset 0 0 20px rgba(212,175,55,.08);
}


/* Destello superior */

.envelope::after{
    content:"✦";

    position:absolute;

    top:25px;
    right:30px;

    color:var(--oro-brillante);

    font-size:32px;

    text-shadow:
        0 0 8px white,
        0 0 20px var(--oro);

    animation:
        twinkle 1.8s infinite;
}


/* =====================================================
   PEQUEÑOS DESTELLOS DEL SOBRE
===================================================== */

.envelope .magic{
    position:absolute;

    color:var(--oro-brillante);

    text-shadow:
        0 0 8px white,
        0 0 18px var(--oro);

    animation:
        twinkle 2s infinite;
}

.magic.m1{
    left:8%;
    top:22%;
}

.magic.m2{
    right:8%;
    top:48%;
    animation-delay:.7s;
}

.magic.m3{
    left:13%;
    bottom:18%;
    animation-delay:1.1s;
}

.magic.m4{
    right:15%;
    bottom:15%;
    animation-delay:1.7s;
}


.envelope-content{
    position:relative;

    z-index:3;

    padding:35px;
}


.intro-small{
    font-family:Arial,sans-serif;

    font-size:11px;

    letter-spacing:5px;

    text-transform:uppercase;

    color:var(--oro-oscuro);

    margin-bottom:24px;
}


/* =====================================================
   PORTADA — FRASE
===================================================== */

.intro h1{
    font-size:clamp(35px,8.5vw,67px);

    font-weight:normal;

    line-height:1.12;

    color:#222;

    text-shadow:
        0 1px 0 white;
}

.intro h1 span{
    display:block;

    margin-top:8px;

    color:var(--oro);

    text-shadow:
        0 0 4px rgba(255,255,255,.8),
        0 0 12px rgba(212,175,55,.35);
}


.intro-line{
    width:130px;

    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--oro),
            var(--oro-brillante),
            var(--oro),
            transparent
        );

    margin:28px auto;
}


.intro-text{
    font-size:19px;

    font-style:italic;

    line-height:1.7;

    color:#555;
}


/* =====================================================
   BOTON ABRIR
===================================================== */

.open-button{
    margin-top:35px;

    padding:16px 38px;

    border:1px solid var(--oro);

    border-radius:40px;

    background:
        linear-gradient(
            135deg,
            #b88920,
            var(--oro),
            #ffe58a,
            var(--oro),
            #a87913
        );

    background-size:250% 250%;

    color:#fff;

    font-family:Arial,sans-serif;

    font-weight:bold;

    letter-spacing:2px;

    cursor:pointer;

    box-shadow:
        0 0 12px rgba(212,175,55,.35),
        0 8px 25px rgba(150,110,20,.25);

    animation:
        goldButton 4s infinite;

    transition:.4s;
}

.open-button:hover{
    transform:
        translateY(-3px)
        scale(1.04);

    box-shadow:
        0 0 20px rgba(255,217,102,.8),
        0 0 40px rgba(212,175,55,.45);
}

@keyframes goldButton{

    0%,100%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

}


/* =====================================================
   ANIMACION AL ABRIR
===================================================== */

.intro.hide .envelope{
    animation:
        envelopeOpen 1s ease forwards;
}

@keyframes envelopeOpen{

    0%{
        transform:scale(1) rotate(0);
    }

    50%{
        transform:scale(1.08) rotate(1deg);
    }

    100%{
        transform:scale(1.25) rotate(-2deg);
        opacity:0;
    }

}


/* =====================================================
   HERO
===================================================== */

.hero{
    min-height:100vh;
